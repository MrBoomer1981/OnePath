[project]
name = "onepath"
version = "0.1.0"
description = "Personal radar of opportunities with deadlines (hackathons, schools, internships, grants), read by DeepSeek"
requires-python = ">=3.12"
# Shared by every part (my_browser/common); each part's own packages are in its group below.
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
core = ["nicegui>=3.18.0"]
news = ["feedparser>=6.0.14", "beautifulsoup4>=4.15.0", "tzdata>=2026.5", "fastapi>=0.143.3", "uvicorn>=0.54.0",
        "fastembed>=0.9.1", "gpt-researcher>=0.16.1", "json-repair>=0.64.0"]  # tzdata: zoneinfo on slim images; fastembed: in a child process
dev = ["fonttools[woff]>=4.60"]  # dev/icons.py cuts the icon font; not in the image (the Dockerfile's --no-dev)

[tool.uv]
# app.py runs both parts in one process, so `uv run` installs both groups (and dev's tools); an image for a single
# part would use `uv sync --no-default-groups --group <part>`.
default-groups = ["core", "news", "dev"]

# my_browser is installed into the environment (editable), so `python -m my_browser.<part>` works from
# any folder of the repository, not only from its root. The Dockerfile skips it (--no-install-project):
# the image runs from /app, the code's own directory.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_browser"]
